[package]
name = "md-notes"
description = "MD Notes — Markdown knowledge base"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "md_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "../../crates/notes-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# File watching is desktop-only for now; mobile vaults live in the app sandbox.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-debouncer-mini = "0.7"
