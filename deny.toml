# License gate for Rust dependencies (cargo-deny). MD Notes is proprietary
# software (LICENSE.md): every bundled dependency must be usable in a
# closed-source distribution. See THIRD_PARTY_NOTICES.md and
# PROJECT_RULES.md, section 6.

[graph]
all-features = true

[advisories]
# Fail direct/workspace unmaintained dependencies; transitive maintenance notices
# remain visible without blocking when no safe upstream migration exists.
unmaintained = "workspace"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "age 0.12.1 is the latest upstream release and unconditionally includes the legacy p256/hpke stack; MD Notes encrypted vaults use only age::x25519 recipients/identities, not tag/tagpq/P-256. Temporary exception pending an upstream age release that removes or upgrades crypto-bigint." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Our own crates are not published and carry the proprietary LICENSE.md.
[licenses.private]
ignore = true

# MPL-2.0 is file-level copyleft and explicitly allows use in a proprietary
# "Larger Work" (MPL-2.0 §3.3). These crates come only from the Tauri
# platform itself (tauri-utils/wry -> dom_query, tauri/wry -> dirs) and are
# used unmodified; their sources stay available on crates.io. Any other
# copyleft dependency needs a replacement (PROJECT_RULES.md, section 6).
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
