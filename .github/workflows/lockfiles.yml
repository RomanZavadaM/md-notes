# Manually refreshes Cargo.lock and app/package-lock.json on a branch after
# dependencies were added or changed: Actions -> Lockfiles -> Run workflow.
# The feature branch push trigger below is temporary and will be removed after
# package-lock.json is refreshed for the knowledge graph dependencies.
name: Lockfiles

on:
  workflow_dispatch:
  push:
    branches: [feature/knowledge-graph-v0.2]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Update npm lockfile
        working-directory: app
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Update Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Lockfiles are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update lockfiles"
          git push
