# Manually refreshes Cargo.lock and app/package-lock.json on a branch after
# dependencies were added or changed: Actions -> Lockfiles -> Run workflow.
name: Lockfiles

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.0.0-stable-audit-cleanup

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Update npm lockfile
        working-directory: app
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Update Cargo.lock
        run: |
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-root-certs --precise 1.0.10
          cargo update -p ctutils --precise 0.4.4
          cargo update -p tauri
          cargo update -p tauri-build
          cargo update -p tauri-plugin-dialog
          cargo update -p tauri-plugin-opener
          cargo metadata --format-version 1 > /dev/null
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Lockfiles are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update lockfiles"
          git push
