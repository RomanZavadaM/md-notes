name: Publish Windows Runtime Test

on:
  push:
    branches: [test/publish-windows-runtime]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Build Tauri app
        working-directory: app
        run: npm run tauri -- build --no-bundle
      - name: Assemble runtime-test ZIP
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'runtime-test'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exeCandidates = @((Join-Path $PWD 'target\release\md-notes.exe'), (Join-Path $PWD 'app\src-tauri\target\release\md-notes.exe'))
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw 'md-notes.exe not found' }
          Copy-Item $exe (Join-Path $out 'MD Notes.exe')
          Copy-Item LICENSE.md,COPYRIGHT.md,THIRD_PARTY_NOTICES.md -Destination $out
          $readme = @('MD Notes - Windows runtime test build','','Purpose: verify the reported startup/runtime freeze on Windows before the next normal checkpoint.','','Test: startup; About dialog; manually open an existing vault; report whether freezing occurs before or after vault selection.','','Temporary unsigned test build, not a stable release.')
          $readme | Set-Content -Encoding UTF8 (Join-Path $out 'README-RUNTIME-TEST.txt')
          Compress-Archive -Path "$out\*" -DestinationPath 'MD-Notes-Windows-x64-runtime-test.zip' -Force
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create runtime-test-windows-2026-10-02 'MD-Notes-Windows-x64-runtime-test.zip' --repo '${{ github.repository }}' --target main --title 'MD Notes - Windows runtime test (2026-10-02)' --notes 'Temporary Windows prerelease for validating the reported runtime freeze. Built from current main after v0.2 functional completion. This is not a normal version checkpoint and does not replace v0.2.1. Please test startup, About, and manual vault opening. Unsigned test build.' --prerelease
