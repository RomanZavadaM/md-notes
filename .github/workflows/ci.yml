name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify changed paths
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      frontend: ${{ steps.paths.outputs.frontend }}
      licenses: ${{ steps.paths.outputs.licenses }}
      packaging: ${{ steps.paths.outputs.packaging }}
    steps:
      - id: paths
        name: Classify PR files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          rust=false
          frontend=false
          licenses=false
          packaging=false
          unknown=false

          while IFS= read -r file; do
            case "$file" in
              app/src-tauri/tauri.conf.json)
                rust=true
                frontend=true
                packaging=true
                ;;
              crates/*|app/src-tauri/*|Cargo.toml|Cargo.lock|.cargo/*|rust-toolchain|rust-toolchain.toml)
                rust=true
                frontend=true
                ;;
              app/src/*|app/public/*|app/index.html|app/vite.config.*|app/tsconfig*.json)
                frontend=true
                ;;
              app/scripts/*)
                frontend=true
                licenses=true
                ;;
              app/package.json|app/package-lock.json)
                frontend=true
                licenses=true
                ;;
              deny.toml|about.toml)
                licenses=true
                ;;
              .github/workflows/ci.yml)
                rust=true
                frontend=true
                licenses=true
                packaging=true
                ;;
              .github/workflows/release.yml)
                packaging=true
                ;;
              .github/workflows/*)
                ;;
              *)
                # Unknown non-documentation files are checked conservatively.
                unknown=true
                ;;
            esac
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')

          if [[ "$unknown" == true ]]; then
            rust=true
            frontend=true
            licenses=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "licenses=$licenses" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

          printf 'rust=%s frontend=%s licenses=%s packaging=%s unknown=%s\n' "$rust" "$frontend" "$licenses" "$packaging" "$unknown"

  core:
    name: notes-core (${{ matrix.os }})
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked -p notes-core --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p notes-core
      - name: Clippy (encrypted-vault feature)
        run: cargo clippy --locked -p notes-core --all-targets --features encrypted-vault -- -D warnings
      - name: Test (encrypted-vault feature)
        run: cargo test --locked -p notes-core --features encrypted-vault

  frontend:
    name: Frontend build
    needs: classify
    if: ${{ needs.classify.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm lock metadata
        working-directory: app
        run: node -e "const p=require('./package.json'), l=require('./package-lock.json'); if (p.version !== l.version || p.version !== l.packages[''].version) { console.error({package:p.version,lock:l.version,root:l.packages[''].version}); process.exit(1) }"
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Verify seven-language i18n parity
        working-directory: app
        run: npm run i18n:check
      - name: Audit production npm dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and build frontend
        working-directory: app
        run: npm run build

  tauri-linux:
    name: Tauri clippy (Linux)
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Clippy (Tauri app)
        run: cargo clippy --locked -p md-notes --all-targets -- -D warnings

  tauri-macos:
    name: Tauri clippy (macOS)
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (macOS Tauri app)
        run: cargo clippy --locked -p md-notes --all-targets -- -D warnings

  licenses:
    name: Dependency licenses
    needs: classify
    if: ${{ needs.classify.outputs.licenses == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm licenses
        working-directory: app
        run: npm run licenses

  windows-package:
    name: Windows offline installer smoke
    needs: classify
    if: ${{ needs.classify.outputs.packaging == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Verify Cargo.lock is reproducible
        run: cargo metadata --locked --format-version 1
      - name: Build NSIS and MSI with offline WebView2
        working-directory: app
        run: npm run tauri build -- --bundles nsis,msi
      - name: Upload installer smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-offline-installers-smoke
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release-metadata:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    name: Release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Cargo.lock matches release manifests
        run: cargo metadata --locked --format-version 1
      - name: Verify release versions match
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          package = json.loads(Path("app/package.json").read_text(encoding="utf-8"))
          package_lock = json.loads(Path("app/package-lock.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("app/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          version_marker = Path("version.txt").read_text(encoding="utf-8").strip()

          versions = {
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "version.txt": version_marker,
              "app/package.json": package["version"],
              "app/package-lock.json": package_lock["version"],
              "app/package-lock.json#root": package_lock["packages"][""]["version"],
              "app/src-tauri/tauri.conf.json": tauri["version"],
          }

          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release version mismatch: {versions}")
          version = next(iter(versions.values()))

          print("Release versions are consistent:", version)

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
