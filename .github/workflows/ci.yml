name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: notes-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p notes-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p notes-core

  app:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: app (frontend + Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: app
        run: npm run build
      - name: Clippy (Tauri app)
        run: cargo clippy -p md-notes --all-targets -- -D warnings

  app-macos:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: app (macOS Tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (macOS Tauri app)
        run: cargo clippy -p md-notes --all-targets -- -D warnings

  licenses:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm licenses
        working-directory: app
        run: npm run licenses

  release-metadata:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    name: Release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release versions match
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          package = json.loads(Path("app/package.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("app/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          versions = {
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "app/package.json": package["version"],
              "app/src-tauri/tauri.conf.json": tauri["version"],
          }

          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release version mismatch: {versions}")

          print("Release versions are consistent:", next(iter(versions.values())))

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
