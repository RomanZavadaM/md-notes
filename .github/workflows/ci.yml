name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify changed paths
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      frontend: ${{ steps.paths.outputs.frontend }}
      licenses: ${{ steps.paths.outputs.licenses }}
    steps:
      - id: paths
        name: Classify PR files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          rust=false
          frontend=false
          licenses=false
          unknown=false

          while IFS= read -r file; do
            case "$file" in
              crates/*|app/src-tauri/*|Cargo.toml|Cargo.lock|.cargo/*|rust-toolchain|rust-toolchain.toml)
                rust=true
                frontend=true
                ;;
              app/src/*|app/public/*|app/index.html|app/vite.config.*|app/tsconfig*.json)
                frontend=true
                ;;
              app/package.json|app/package-lock.json)
                frontend=true
                licenses=true
                ;;
              deny.toml|about.toml)
                licenses=true
                ;;
              .github/workflows/ci.yml)
                rust=true
                frontend=true
                licenses=true
                ;;
              .github/workflows/*)
                ;;
              *)
                # Unknown non-documentation files are checked conservatively.
                unknown=true
                ;;
            esac
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')

          if [[ "$unknown" == true ]]; then
            rust=true
            frontend=true
            licenses=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "licenses=$licenses" >> "$GITHUB_OUTPUT"

          printf 'rust=%s frontend=%s licenses=%s unknown=%s\n' "$rust" "$frontend" "$licenses" "$unknown"

  core:
    name: notes-core (${{ matrix.os }})
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p notes-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p notes-core
      - name: Clippy (encrypted-vault feature)
        run: cargo clippy -p notes-core --all-targets --features encrypted-vault -- -D warnings
      - name: Test (encrypted-vault feature)
        run: cargo test -p notes-core --features encrypted-vault

  frontend:
    name: Frontend build
    needs: classify
    if: ${{ needs.classify.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: app
        run: npm run build

  tauri-linux:
    name: Tauri clippy (Linux)
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Clippy (Tauri app)
        run: cargo clippy -p md-notes --all-targets -- -D warnings

  tauri-macos:
    name: Tauri clippy (macOS)
    needs: classify
    if: ${{ needs.classify.outputs.rust == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (macOS Tauri app)
        run: cargo clippy -p md-notes --all-targets -- -D warnings

  licenses:
    name: Dependency licenses
    needs: classify
    if: ${{ needs.classify.outputs.licenses == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm licenses
        working-directory: app
        run: npm run licenses

  release-metadata:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    name: Release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release versions match
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          package = json.loads(Path("app/package.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("app/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))

          versions = {
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "app/package.json": package["version"],
              "app/src-tauri/tauri.conf.json": tauri["version"],
          }

          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release version mismatch: {versions}")

          print("Release versions are consistent:", next(iter(versions.values())))

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
