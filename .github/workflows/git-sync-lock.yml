name: Git sync lock artifact

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/git-sync-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Verify gix is locked
        run: grep -q '^name = "gix"$' Cargo.lock
      - name: Commit generated lock if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock gix dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
