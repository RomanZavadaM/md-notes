name: Git sync lock artifact

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/git-sync-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Verify gix is locked
        run: grep -q '^name = "gix"$' Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
