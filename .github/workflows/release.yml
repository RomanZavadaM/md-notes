# release-please keeps a release PR with the next version and CHANGELOG.
# Merging that PR creates a tag and a GitHub release; the build job then
# attaches desktop installers and portable packages to it.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Verify release lockfiles
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cd app
          node -e "const p=require('./package.json'), l=require('./package-lock.json'); if (p.version !== l.version || p.version !== l.packages[''].version) process.exit(1)"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: MD Notes ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }}
      - name: Upload Windows x64 portable package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "MD-Notes-$version-Windows-x64-portable"
          $dir = Join-Path $PWD "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $candidates = @(
            (Join-Path $PWD "target/release/md-notes.exe"),
            (Join-Path $PWD "app/src-tauri/target/release/md-notes.exe")
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "Portable executable not found. Checked: $($candidates -join ', ')"
          }

          Copy-Item $exe (Join-Path $dir "MD Notes.exe")
          Copy-Item "LICENSE.md" $dir
          Copy-Item "COPYRIGHT.md" $dir
          Copy-Item "THIRD_PARTY_NOTICES.md" $dir

          @"
          MD Notes $version — Windows x64 portable

          Запуск: відкрийте "MD Notes.exe" без інсталяції.
          Дані сховища не зберігаються всередині цієї папки: MD Notes працює з вибраними Markdown-сховищами.
          Для роботи застосунку Windows має мати доступний Microsoft Edge WebView2 Runtime.
          Збірка не підписана, доки в release notes прямо не вказано інше.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dir "README-PORTABLE.txt")

          $zip = Join-Path $PWD "dist/$name.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          gh release upload "$env:TAG" "$zip" --clobber

  # START/source package, legal notices and SHA256SUMS.txt for every release
  # (PROJECT_RULES.md, section 8).
  assets:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upload START/source package and legal notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          NAME="MD-Notes-${VERSION}-START"
          mkdir -p dist
          git archive --format=zip --prefix="${NAME}/" -o "dist/${NAME}.zip" HEAD
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md dist/
          gh release upload "$TAG" dist/* --clobber
      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p all
          gh release download "$TAG" -D all
          (cd all && rm -f SHA256SUMS.txt && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

  # After the assets exist: point the download links of every README at this
  # release. release-please's generic updater replaces only the first version
  # on a line, so the script does it.
  readme-links:
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update README download links
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python3 scripts/bump_readme_links.py "${TAG#v}"
          if git diff --quiet; then
            echo "README links already point at ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/readme
          git commit -m "docs: посилання на завантаження ${TAG}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
