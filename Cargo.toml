[workspace]
resolver = "2"
members = ["crates/notes-core", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RomanZavadaM/md-notes"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
