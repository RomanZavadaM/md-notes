[package]
name = "notes-core"
description = "Core library of MD Notes: vaults, notes, Markdown parsing"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "status", "revision"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
ulid = "1"
# Optional encrypted vault (ADR-0007). No default features: no async, CLI, plugin or SSH code.
age = { version = "0.12", default-features = false, optional = true }

[features]
# Opt-in support for encrypted vaults. Builds without it are the full product without encryption.
encrypted-vault = ["dep:age"]

[dev-dependencies]
tempfile = "3"
